[project]
name = "duit-ku"
version = "0.1.0"
description = "Catatan Duit Ku"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "module-typica>=0.2.12",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-telegram-bot>=22.6",
    "sqlalchemy>=2.0.48",
    "tomli>=2.4.0",
]


[project.scripts]
duitku-run = "src.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
include = ["src"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# ----------------------------------------------------------
#                 RUFF CONFIGURATION
# ----------------------------------------------------------
[tool.ruff]
src = ["src"]

# Linting rule sets
select = [
    "F",    # Pyflakes
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "I",    # Import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]      # allow asserts
"__init__.py" = ["F401"]  # allow unused imports
